[package]
name = "keephost-pool"
version = "0.1.0"
description = "KeepHost — non-custodial pool: deposits held in a PDA, withdrawal on zero-knowledge proof"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "keephost_pool"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.2"
# Only for the burn CPI: a key is minted by destroying tokens, nothing else.
anchor-spl = "0.31.2"
groth16-solana = "0.2.0"
solana-poseidon = "2.3"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
