name: test

# What this badge proves: the circuit, the proving key and the client library
# agree — an honest withdrawal proof verifies, and the same proof is refused as
# soon as the recipient or the root changes. No chain, no validator, no Solana
# toolchain, so a red badge here means this repository broke, not that a
# toolchain moved.
#
# The full chain — program, validator, deposit, withdrawal, refused double
# spend — is in e2e.yml, run nightly and on demand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # circom is a Rust binary, not an npm package: `npx circom` pulls the
      # abandoned JavaScript one from 2019, which does not understand
      # `pragma circom 2`.
      - name: circom
        run: |
          curl -sSfL -o /usr/local/bin/circom \
            https://github.com/iden3/circom/releases/latest/download/circom-linux-amd64
          chmod +x /usr/local/bin/circom
          circom --version

      - name: Dependencies
        run: npm ci --no-audit --no-fund --prefix circuits

      # Throwaway keys, generated here. Nothing is downloaded: the public Hermez
      # phase-one mirrors have returned 403 since 14 September 2026, and a test
      # that depends on a file hosted elsewhere breaks the day that elsewhere
      # disappears. The production key comes from CEREMONY.md.
      - name: Circuit and a throwaway proving key
        working-directory: circuits
        run: |
          snarkjs=node_modules/.bin/snarkjs
          circom withdraw.circom --r1cs --wasm -l node_modules -o .
          $snarkjs powersoftau new bn128 14 pot_0000.ptau -v
          echo "github actions entropy" | $snarkjs powersoftau contribute \
            pot_0000.ptau pot_0001.ptau --name="ci" -v
          $snarkjs powersoftau prepare phase2 pot_0001.ptau pot_final.ptau -v
          $snarkjs groth16 setup withdraw.r1cs pot_final.ptau withdraw_0000.zkey
          echo "github actions entropy 2" | $snarkjs zkey contribute \
            withdraw_0000.zkey withdraw_final.zkey --name="ci" -v
          $snarkjs zkey export verificationkey withdraw_final.zkey verification_key.json

      - name: An honest proof verifies, a tampered one does not
        run: node scripts/test-proof.mjs
